# Text LLM options for the autoplay web dashboard (GET /api/text-llm, POST /api/text-llm).
# Restart the web server after edits. Override path: ADVENTURE_NL_WEB_PRESETS_YAML=...
#
# Structure:
#   providers.mlx     — local Apple Silicon MLX weights (Hugging Face repo ids)
#   providers.http    — extra OpenAI-*compatible* chat model names (merged after env)
#   providers.api     — hosted vendor APIs: google (wired today), optional keys reserved
#                       for future first-class providers (e.g. openai for ChatGPT API).
#   providers.google  — legacy alias for providers.api.google (omit if you use providers.api)
#
# Google: use model code strings from each model’s doc page under
#   https://ai.google.dev/gemini-api/docs/models
# and the deprecations list https://ai.google.dev/gemini-api/docs/deprecations
# (e.g. do not use gemini-3-pro-preview — shut down; migrate to gemini-3.1-pro-preview).
#
# Below: general text / multimodal chat models only (omit image-only, TTS, Live API–first, Veo, Lyria, etc.).

version: 1

providers:
  mlx:
    models:
      - id: mlx-community/gemma-2-2b-it
      - id: mlx-community/Qwen2.5-1.5B-Instruct-4bit
      - id: mlx-community/Llama-3.2-3B-Instruct-4bit
      - id: mlx-community/Qwen2.5-3B-Instruct-4bit
      - id: mlx-community/Phi-4-mini-instruct-4bit
      - id: mlx-community/Mistral-7B-Instruct-v0.3-4bit
      - id: mlx-community/Qwen2.5-7B-Instruct-4bit
      - id: mlx-community/gemma-2-9b-it-4bit

  http:
    models: []

  api:
    google:
      models:
        # --- Gemini 3 (preview text models; see models index) ---
        - id: gemini-3.1-pro-preview
          label: Gemini 3.1 Pro (Preview)
        - id: gemini-3-flash-preview
          label: Gemini 3 Flash (Preview)
        - id: gemini-3.1-flash-lite-preview
          label: Gemini 3.1 Flash-Lite (Preview)
        # --- Gemini 2.5 (stable text; model code on each doc page) ---
        - id: gemini-2.5-flash
          label: Gemini 2.5 Flash
        - id: gemini-2.5-flash-lite
          label: Gemini 2.5 Flash-Lite
        - id: gemini-2.5-pro
          label: Gemini 2.5 Pro
        # --- Version alias (see “Model version name patterns” on models index) ---
        - id: gemini-flash-latest
          label: gemini-flash-latest (rolling alias)
        # --- Legacy (check deprecations before production) ---
        - id: gemini-1.5-flash
          label: Gemini 1.5 Flash (legacy)
        - id: gemini-1.5-pro
          label: Gemini 1.5 Pro (legacy)
        - id: gemini-2.0-flash
          label: Gemini 2.0 Flash (deprecated)
        - id: gemini-2.0-flash-lite
          label: Gemini 2.0 Flash-Lite (deprecated)

    # Reserved for a future native OpenAI provider (ChatGPT / Responses API).
    # Today, OpenAI-compatible servers use providers.http + ADVENTURE_NL_HTTP_* env.
    openai:
      models: []
      # examples when wired:
      # - id: gpt-4o
      # - id: gpt-4o-mini
