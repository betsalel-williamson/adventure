openapi: 3.1.0
info:
  title: adventure-v2 HTTP API
  version: 0.1.0
  description: Game run lifecycle, turns, SSE fanout, checkpoints, replay, and unified inference relay. Generated from Zod contracts in packages/contracts.
servers:
  - url: http://127.0.0.1:8787
components:
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
        service:
          type: string
          enum:
            - adventure-v2
        version:
          type: string
        gitSha:
          type: string
        imageTag:
          type: string
        builtAt:
          type: string
          nullable: true
        oracleMode:
          type: string
          enum:
            - synthetic
            - process
        processOracleScript:
          type: string
          nullable: true
      required:
        - status
        - service
        - version
        - gitSha
        - imageTag
        - builtAt
        - oracleMode
        - processOracleScript
    PayloadTooLarge:
      type: object
      properties:
        error:
          type: string
          enum:
            - payload_too_large
      required:
        - error
    Unauthorized:
      type: object
      properties:
        error:
          type: string
          enum:
            - unauthorized
        message:
          type: string
          minLength: 1
      required:
        - error
        - message
  parameters: {}
paths:
  /health:
    get:
      summary: Liveness and oracle mode
      responses:
        "200":
          description: Service health with oracle wiring summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /runs:
    post:
      summary: Start a run
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                config:
                  type: object
                  properties:
                    scenarioId:
                      type: string
                      minLength: 1
                    modelCategory:
                      type: string
                      enum: &a1
                        - SLM
                        - LLM
                        - API
                        - MLX
                    modelName:
                      type: string
                      minLength: 1
                    seed:
                      type: integer
                      minimum: 0
                    cognitionProfile:
                      type: string
                      minLength: 1
                      maxLength: 128
                  required:
                    - scenarioId
                    - modelCategory
                    - modelName
                    - seed
              required:
                - config
      responses:
        "201":
          description: Run created
          content:
            application/json:
              schema:
                type: object
                properties:
                  runId:
                    type: string
                    minLength: 1
                  config:
                    type: object
                    properties:
                      scenarioId:
                        type: string
                        minLength: 1
                      modelCategory:
                        type: string
                        enum: *a1
                      modelName:
                        type: string
                        minLength: 1
                      seed:
                        type: integer
                        minimum: 0
                      cognitionProfile:
                        type: string
                        minLength: 1
                        maxLength: 128
                    required:
                      - scenarioId
                      - modelCategory
                      - modelName
                      - seed
                required:
                  - runId
                  - config
        "413":
          description: JSON body exceeds 256 KiB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayloadTooLarge"
  /runs/{runId}/turns:
    post:
      summary: Submit a parser command
      parameters:
        - schema:
            type: string
            minLength: 1
          required: true
          name: runId
          in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                input:
                  type: string
                forceReject:
                  type: boolean
              required:
                - input
      responses:
        "204":
          description: Turn accepted
        "413":
          description: JSON body exceeds 256 KiB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayloadTooLarge"
  /runs/{runId}/events:
    get:
      summary: Subscribe to run events (SSE)
      parameters:
        - schema:
            type: string
            minLength: 1
          required: true
          name: runId
          in: path
      responses:
        "200":
          description: Server-Sent Events stream. Each event is JSON in `data:` with `event` turn | phase | trace. See SseWireEvent schema.
          content:
            text/event-stream:
              schema:
                oneOf:
                  - type: object
                    properties:
                      event:
                        type: string
                        enum:
                          - turn
                      envelope:
                        type: object
                        properties:
                          runId:
                            type: string
                            minLength: 1
                          turnId:
                            type: string
                            minLength: 1
                          sequence:
                            type: integer
                            minimum: 0
                          source:
                            type: string
                            enum:
                              - client
                              - cognition
                              - oracle
                              - control
                          kind:
                            type: string
                            enum:
                              - perceive
                              - proposal
                              - oracle_observation
                              - reconcile
                              - checkpoint
                              - recovery
                          ts:
                            type: string
                            minLength: 1
                          payload:
                            type: object
                            additionalProperties:
                              nullable: true
                        required:
                          - runId
                          - turnId
                          - sequence
                          - source
                          - kind
                          - ts
                          - payload
                    required:
                      - event
                      - envelope
                  - type: object
                    properties:
                      event:
                        type: string
                        enum:
                          - phase
                      transition:
                        type: object
                        properties:
                          from:
                            type: string
                            enum: &a2
                              - act
                              - think
                              - test
                              - chaos
                              - disorder
                          to:
                            type: string
                            enum: *a2
                          reason:
                            type: string
                          sequence:
                            type: integer
                            minimum: 0
                          ts:
                            type: string
                            minLength: 1
                        required:
                          - from
                          - to
                          - reason
                          - sequence
                          - ts
                    required:
                      - event
                      - transition
                  - type: object
                    properties:
                      event:
                        type: string
                        enum:
                          - trace
                      trace:
                        type: object
                        properties:
                          runId:
                            type: string
                            minLength: 1
                          turnId:
                            type: string
                            minLength: 1
                          sequence:
                            type: integer
                            minimum: 0
                          nodeId:
                            type: string
                            minLength: 1
                          graphNodeId:
                            type: string
                            minLength: 1
                          stepIndex:
                            type: integer
                            minimum: 0
                          label:
                            type: string
                            minLength: 1
                          ts:
                            type: string
                            minLength: 1
                          promptDigest:
                            type: string
                          promptSummary:
                            type: string
                          promptRole:
                            type: string
                            enum:
                              - system
                              - user
                              - assistant
                          promptSystem:
                            type: string
                            maxLength: 16384
                          promptUser:
                            type: string
                            maxLength: 16384
                          payload:
                            type: object
                            additionalProperties:
                              nullable: true
                        required:
                          - runId
                          - turnId
                          - sequence
                          - nodeId
                          - label
                          - ts
                          - payload
                    required:
                      - event
                      - trace
  /runs/{runId}/checkpoints:
    get:
      summary: List checkpoints for a run
      parameters:
        - schema:
            type: string
            minLength: 1
          required: true
          name: runId
          in: path
      responses:
        "200":
          description: Checkpoint references
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    checkpointId:
                      type: string
                      minLength: 1
                    runId:
                      type: string
                      minLength: 1
                    threadId:
                      type: string
                      minLength: 1
                    turnId:
                      type: string
                      minLength: 1
                    sequence:
                      type: integer
                      minimum: 0
                    replayInputRef:
                      type: string
                      minLength: 1
                    createdAt:
                      type: string
                      minLength: 1
                  required:
                    - checkpointId
                    - runId
                    - threadId
                    - turnId
                    - sequence
                    - replayInputRef
                    - createdAt
  /runs/{runId}/replay:
    post:
      summary: Restore from a checkpoint
      parameters:
        - schema:
            type: string
            minLength: 1
          required: true
          name: runId
          in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                checkpointId:
                  type: string
                  minLength: 1
              required:
                - checkpointId
      responses:
        "200":
          description: Replay payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  checkpointId:
                    type: string
                    minLength: 1
                  runId:
                    type: string
                    minLength: 1
                  sequence:
                    type: integer
                    minimum: 0
                  replayInputRef:
                    type: string
                    minLength: 1
                  controlPhase:
                    type: string
                    enum:
                      - act
                      - think
                      - test
                      - chaos
                      - disorder
                  pendingOracleSequence:
                    type: integer
                    nullable: true
                    minimum: 0
                  restoredAt:
                    type: string
                    minLength: 1
                required:
                  - checkpointId
                  - runId
                  - sequence
                  - replayInputRef
                  - controlPhase
                  - pendingOracleSequence
                  - restoredAt
        "404":
          description: Unknown run or checkpoint
        "413":
          description: JSON body exceeds 256 KiB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayloadTooLarge"
  /session:
    post:
      summary: Create session principal and issue HttpOnly cookie
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessionId:
                    type: string
                    format: uuid
                required:
                  - sessionId
  /pairing/codes:
    post:
      summary: Issue short-lived pairing code for desktop agent bootstrap
      responses:
        "201":
          description: Pairing code issued (single use, ~5 min TTL)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    pattern: ^[A-Z2-9]{6,8}$
                  expiresAt:
                    type: string
                    format: date-time
                required:
                  - code
                  - expiresAt
        "401":
          description: Missing or invalid session cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unauthorized"
  /pairing/redeem:
    post:
      summary: Redeem pairing code and register desktop device token
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  pattern: ^[A-Z2-9]{6,8}$
                deviceLabel:
                  type: string
                  minLength: 1
                  maxLength: 128
              required:
                - code
      responses:
        "200":
          description: Device registered; store deviceToken in OS keychain only
          content:
            application/json:
              schema:
                type: object
                properties:
                  deviceId:
                    type: string
                    format: uuid
                  deviceToken:
                    type: string
                    minLength: 32
                  sessionId:
                    type: string
                    format: uuid
                required:
                  - deviceId
                  - deviceToken
                  - sessionId
        "404":
          description: Unknown pairing code
        "410":
          description: Expired or already redeemed pairing code
        "429":
          description: Too many redeem attempts (rate limited)
  /inference/plan:
    post:
      summary: Planner inference (stateless system + user)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                requestId:
                  type: string
                  format: uuid
                mode:
                  type: string
                  enum: &a4
                    - planner
                    - interpret
                    - navigator
                system:
                  type: string
                user:
                  type: string
                schemaMode:
                  type: string
                  nullable: true
                  enum: &a5
                    - planner
                    - interpret
                modelHint:
                  type: object
                  properties:
                    providerId:
                      type: string
                      enum: &a3
                        - google
                        - http
                        - ollama
                        - mlx
                    modelId:
                      type: string
                      minLength: 1
                  required:
                    - providerId
              required:
                - requestId
                - mode
                - system
                - user
                - schemaMode
      responses:
        "200":
          description: Planner JSON result
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      requestId:
                        type: string
                        format: uuid
                      ok:
                        type: boolean
                        enum:
                          - true
                      json:
                        type: object
                        additionalProperties:
                          nullable: true
                      text:
                        type: string
                      providerId:
                        type: string
                        enum: *a3
                      modelId:
                        type: string
                        minLength: 1
                      durationMs:
                        type: integer
                        minimum: 0
                    required:
                      - requestId
                      - ok
                      - json
                      - providerId
                      - modelId
                      - durationMs
                  - type: object
                    properties:
                      requestId:
                        type: string
                        format: uuid
                      ok:
                        type: boolean
                        enum:
                          - false
                      code:
                        type: string
                        minLength: 1
                      message:
                        type: string
                        minLength: 1
                    required:
                      - requestId
                      - ok
                      - code
                      - message
        "401":
          description: Missing or invalid session cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unauthorized"
  /inference/navigator:
    post:
      summary: Assist navigator inference (stateless system + user)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                requestId:
                  type: string
                  format: uuid
                mode:
                  type: string
                  enum: *a4
                system:
                  type: string
                user:
                  type: string
                schemaMode:
                  type: string
                  nullable: true
                  enum: *a5
                modelHint:
                  type: object
                  properties:
                    providerId:
                      type: string
                      enum: *a3
                    modelId:
                      type: string
                      minLength: 1
                  required:
                    - providerId
              required:
                - requestId
                - mode
                - system
                - user
                - schemaMode
      responses:
        "200":
          description: Navigator JSON result
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      requestId:
                        type: string
                        format: uuid
                      ok:
                        type: boolean
                        enum:
                          - true
                      json:
                        type: object
                        additionalProperties:
                          nullable: true
                      text:
                        type: string
                      providerId:
                        type: string
                        enum: *a3
                      modelId:
                        type: string
                        minLength: 1
                      durationMs:
                        type: integer
                        minimum: 0
                    required:
                      - requestId
                      - ok
                      - json
                      - providerId
                      - modelId
                      - durationMs
                  - type: object
                    properties:
                      requestId:
                        type: string
                        format: uuid
                      ok:
                        type: boolean
                        enum:
                          - false
                      code:
                        type: string
                        minLength: 1
                      message:
                        type: string
                        minLength: 1
                    required:
                      - requestId
                      - ok
                      - code
                      - message
        "401":
          description: Missing or invalid session cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unauthorized"
  /inference/capabilities:
    get:
      summary: List inference providers available for the session
      responses:
        "200":
          description: Hosted, server-local, and paired-desktop capabilities
          content:
            application/json:
              schema:
                type: object
                properties:
                  capabilities:
                    type: array
                    items:
                      type: object
                      properties:
                        providerId:
                          type: string
                          enum: *a3
                        modelId:
                          type: string
                          minLength: 1
                        source:
                          type: string
                          enum:
                            - hosted
                            - server-local
                            - paired-desktop
                        label:
                          type: string
                          minLength: 1
                      required:
                        - providerId
                        - modelId
                        - source
                        - label
                required:
                  - capabilities
        "401":
          description: Missing or invalid session cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unauthorized"
