name: Check out with default branch merge
description: >
  On pull requests, check out the PR head and merge the integration branch so
  CI runs against the combined tree. On push, check out the branch tip.

inputs:
  default-branch:
    description: Integration branch merged into PR heads before tests
    required: false
    default: feature/adventure-llm

runs:
  using: composite
  steps:
    - name: Check out repository
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        fetch-depth: 0

    - name: Merge default branch into PR
      if: github.event_name == 'pull_request'
      shell: bash
      run: |
        set -euo pipefail
        git fetch origin "${{ inputs.default-branch }}"
        git merge --no-edit "origin/${{ inputs.default-branch }}"
