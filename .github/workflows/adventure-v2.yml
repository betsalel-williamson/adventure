name: adventure-v2

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install GNU Fortran
        run: sudo apt-get update && sudo apt-get install -y gfortran

      - name: Build Fortran adventure
        run: make adventure

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: adventure-v2/package-lock.json

      - name: Install dependencies
        working-directory: adventure-v2
        run: npm ci

      - name: Run tests
        working-directory: adventure-v2
        run: npm test

      - name: Fortran oracle bridge (subprocess IPC vs built binary)
        working-directory: adventure-v2
        run: npm run test:oracle-fortran
