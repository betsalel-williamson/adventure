name: changesets

# Opens a "Version Packages" PR when merged changesets are ready to release.
# Packages are private — we version and changelog locally, no npm publish.

on:
  push:
    branches:
      - feature/adventure-llm

concurrency:
  group: changesets
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Create version PR or push tags
        id: changesets
        uses: changesets/action@v1
        with:
          version: npm run version-packages
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
          publish: ./scripts/changesets/publish-release.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  resolve-release:
    needs: version
    if: needs.version.outputs.published == 'true'
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.pkg.outputs.semver }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Read package version
        id: pkg
        run: echo "semver=$(node -p "require('./adventure-v2/package.json').version")" >> "$GITHUB_OUTPUT"

  deploy:
    needs: [version, resolve-release]
    if: needs.version.outputs.published == 'true'
    uses: ./.github/workflows/oci-deploy.yml
    with:
      semver: ${{ needs.resolve-release.outputs.semver }}
      git_sha: ${{ github.sha }}
      push_latest: false
    secrets: inherit
