name: changesets

# Opens a "Version Packages" PR when merged changesets are ready to release.
# Packages are private — we version and changelog locally, no npm publish.

on:
  push:
    branches:
      - feature/adventure-llm

concurrency:
  group: changesets
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Create version PR or push tags
        uses: changesets/action@v1
        with:
          version: npm run version-packages
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
          publish: echo "Private monorepo — skip npm publish"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
