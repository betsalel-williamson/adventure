name: adventure

on:
  push:
  pull_request:

jobs:
  adventure-v2:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install GNU Fortran
        run: sudo apt-get update && sudo apt-get install -y gfortran

      - name: Build Fortran adventure
        run: make adventure

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: adventure-v2/package-lock.json

      - name: Install dependencies
        working-directory: adventure-v2
        run: npm ci

      - name: Audit dependencies
        working-directory: adventure-v2
        run: npm audit

      - name: Run tests
        working-directory: adventure-v2
        run: npm test

      - name: Cucumber HTTP scenarios
        working-directory: adventure-v2
        run: npm run test:cucumber

      - name: Fortran oracle bridge (subprocess IPC vs built binary)
        working-directory: adventure-v2
        run: npm run test:oracle-fortran

  adventure-v3:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install GNU Fortran
        run: sudo apt-get update && sudo apt-get install -y gfortran

      - name: Build Fortran adventure
        run: make adventure

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            adventure-v2/package-lock.json
            adventure-v3/package-lock.json

      - name: Install dependencies (adventure-v2, for Cucumber harness imports)
        working-directory: adventure-v2
        run: npm ci

      - name: Install dependencies (adventure-v3)
        working-directory: adventure-v3
        run: npm ci

      - name: Audit dependencies (adventure-v3)
        working-directory: adventure-v3
        run: npm audit

      - name: Unit tests
        working-directory: adventure-v3
        run: npm test

      - name: Cucumber CRT wire (synthetic oracle)
        working-directory: adventure-v3
        run: npm run test:cucumber

      - name: Cucumber Fortran transcript
        working-directory: adventure-v3
        run: npm run test:cucumber:fortran

      - name: Production build
        working-directory: adventure-v3
        run: npm run build
