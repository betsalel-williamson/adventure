name: adventure

on:
  push:
  pull_request:

jobs:
  adventure-v2:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install GNU Fortran
        run: sudo apt-get update && sudo apt-get install -y gfortran

      - name: Build Fortran adventure
        run: make adventure

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: adventure-v2/package-lock.json

      - name: Install dependencies
        working-directory: adventure-v2
        run: npm ci

      - name: Audit dependencies
        working-directory: adventure-v2
        run: npm audit --audit-level=moderate

      - name: Run tests
        working-directory: adventure-v2
        run: npm test

      - name: Cucumber HTTP scenarios
        working-directory: adventure-v2
        run: npm run test:cucumber

      - name: Fortran oracle bridge (subprocess IPC vs built binary)
        working-directory: adventure-v2
        run: npm run test:oracle-fortran

      - name: OpenAPI spec drift check
        working-directory: adventure-v2
        run: npm run openapi:check

  adventure-langgraph:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install GNU Fortran
        run: sudo apt-get update && sudo apt-get install -y gfortran

      - name: Build Fortran adventure
        run: make adventure

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            adventure-v2/package-lock.json
            adventure-langgraph/package-lock.json

      - name: Install dependencies (adventure-v2, for Cucumber harness imports)
        working-directory: adventure-v2
        run: npm ci

      - name: Install dependencies (adventure-langgraph)
        working-directory: adventure-langgraph
        run: npm ci

      - name: Audit dependencies (adventure-langgraph)
        working-directory: adventure-langgraph
        run: npm audit --audit-level=moderate

      - name: Unit tests
        working-directory: adventure-langgraph
        run: npm test

      - name: Cucumber CRT wire (synthetic oracle)
        working-directory: adventure-langgraph
        run: npm run test:cucumber

      - name: Cucumber Fortran transcript
        working-directory: adventure-langgraph
        run: npm run test:cucumber:fortran

      - name: Production build
        working-directory: adventure-langgraph
        run: npm run build

      - name: OpenAPI spec drift check
        working-directory: adventure-langgraph
        run: npm run openapi:check

  adventure-ag2:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: adventure-ag2/package-lock.json

      - name: Install dependencies (adventure-ag2)
        working-directory: adventure-ag2
        run: npm ci

      - name: Unit tests
        working-directory: adventure-ag2
        run: npm test

  adventure-webclient:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: adventure-webclient/package-lock.json

      - name: Install dependencies (adventure-webclient)
        working-directory: adventure-webclient
        run: npm ci

      - name: Unit tests
        working-directory: adventure-webclient
        run: npm test

      - name: Production build
        working-directory: adventure-webclient
        run: npm run build

  docs-check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies (docs)
        working-directory: docs
        run: npm ci

      - name: mdcp documentation check
        working-directory: docs
        run: npm run docs:check
