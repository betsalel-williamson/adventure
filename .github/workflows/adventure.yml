name: adventure

on:
  pull_request:
  push:
    branches:
      - feature/adventure-llm

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  merge-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Merge default branch into PR
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/merge-default-branch

  adventure-v2:
    needs: merge-check
    if: always() && (github.event_name == 'push' || needs.merge-check.result == 'success')
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Merge default branch into PR
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/merge-default-branch

      - name: Install GNU Fortran
        run: sudo apt-get update && sudo apt-get install -y gfortran

      - name: Build Fortran adventure
        run: make adventure

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: adventure-v2/package-lock.json

      - name: Install dependencies
        working-directory: adventure-v2
        run: npm ci

      - name: Audit dependencies
        working-directory: adventure-v2
        run: npm audit --audit-level=moderate

      - name: Run tests
        working-directory: adventure-v2
        run: npm test

      - name: Cucumber HTTP scenarios
        working-directory: adventure-v2
        run: npm run test:cucumber

      - name: Fortran oracle bridge (subprocess IPC vs built binary)
        working-directory: adventure-v2
        run: npm run test:oracle-fortran

      - name: OpenAPI spec drift check
        working-directory: adventure-v2
        run: npm run openapi:check

  adventure-langgraph:
    needs: merge-check
    if: always() && (github.event_name == 'push' || needs.merge-check.result == 'success')
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Merge default branch into PR
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/merge-default-branch

      - name: Install GNU Fortran
        run: sudo apt-get update && sudo apt-get install -y gfortran

      - name: Build Fortran adventure
        run: make adventure

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            adventure-v2/package-lock.json
            adventure-langgraph/package-lock.json

      - name: Install dependencies (adventure-v2, for Cucumber harness imports)
        working-directory: adventure-v2
        run: npm ci

      - name: Install dependencies (adventure-langgraph)
        working-directory: adventure-langgraph
        run: npm ci

      - name: Audit dependencies (adventure-langgraph)
        working-directory: adventure-langgraph
        run: npm audit --audit-level=moderate

      - name: Unit tests
        working-directory: adventure-langgraph
        run: npm test

      - name: Cucumber CRT wire (synthetic oracle)
        working-directory: adventure-langgraph
        run: npm run test:cucumber

      - name: Cucumber Fortran transcript
        working-directory: adventure-langgraph
        run: npm run test:cucumber:fortran

      - name: Production build
        working-directory: adventure-langgraph
        run: npm run build

      - name: OpenAPI spec drift check
        working-directory: adventure-langgraph
        run: npm run openapi:check

  adventure-ag2:
    needs: merge-check
    if: always() && (github.event_name == 'push' || needs.merge-check.result == 'success')
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Merge default branch into PR
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/merge-default-branch

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: adventure-ag2/package-lock.json

      - name: Install dependencies (adventure-ag2)
        working-directory: adventure-ag2
        run: npm ci

      - name: Unit tests
        working-directory: adventure-ag2
        run: npm test

  adventure-webclient:
    needs: merge-check
    if: always() && (github.event_name == 'push' || needs.merge-check.result == 'success')
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Merge default branch into PR
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/merge-default-branch

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: adventure-webclient/package-lock.json

      - name: Install dependencies (adventure-webclient)
        working-directory: adventure-webclient
        run: npm ci

      - name: Unit tests
        working-directory: adventure-webclient
        run: npm test

      - name: Production build
        working-directory: adventure-webclient
        run: npm run build

  docs-check:
    needs: merge-check
    if: always() && (github.event_name == 'push' || needs.merge-check.result == 'success')
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Merge default branch into PR
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/merge-default-branch

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies (docs)
        working-directory: docs
        run: npm ci

      - name: mdcp documentation check
        working-directory: docs
        run: npm run docs:check
